<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH FEST 2026 — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#12092F;--navy-800:#170B4D;--violet:#7C3AED;--violet-2:#9F5BFF;
    --white:#FFFFFF;--paper:#FFFFFF;--paper-alt:#F5F3FC;--ink:#170B4D;
    --muted:#645C86;--muted-onDark:#C9C3E8;--line:#E3DEF5;--line-onDark:rgba(255,255,255,.16);
    --font-impact:'Anton',sans-serif;--font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2{font-family:var(--font-display);letter-spacing:-.01em;}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet-2);display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .eyebrow::before{content:"";width:20px;height:2px;background:var(--violet-2);display:inline-block;}

  .page-head{position:relative;overflow:hidden;padding:80px 0 50px;border-bottom:1px solid var(--line);background:var(--navy-800);color:#fff;}
  .page-head::before{content:"";position:absolute;top:0;left:0;width:260px;height:16px;background:repeating-linear-gradient(115deg, var(--violet) 0 16px, transparent 16px 24px);clip-path:polygon(0 0,100% 0,80% 100%,0 100%);}
  .page-head h1{font-family:var(--font-impact);font-weight:400;font-size:clamp(34px,5.6vw,58px);margin-bottom:14px;}
  .page-head p{color:var(--muted-onDark);max-width:560px;font-size:15px;};
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:15px;letter-spacing:.03em;color:white;margin-bottom:22px;}
  .back-btn:hover{color:black;}
  section.body-sec{padding:60px 0 90px;}

  .itinerary-frame{
    background:var(--paper-alt);
    border:1px solid var(--line);
    border-top:3px solid var(--violet);
    padding:20px;
    display:flex;
    justify-content:center;
  }
  .itinerary-frame img{
    max-width:100%;
    height:auto;
    display:block;
    box-shadow:0 10px 30px rgba(23,11,77,.12);
  }
  .itinerary-note{
    margin-top:18px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  .download-row{
    display:flex;
    justify-content:center;
    margin-top:24px;
  }
  .btn{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;
    padding:14px 26px;border:1px solid var(--violet);cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:all .2s;
    background:var(--violet);color:#fff;font-weight:700;
  }
  .btn:hover{background:var(--violet-2);border-color:var(--violet-2);}

  footer{padding:26px 0;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--muted-onDark);background:var(--navy-900);border-top:1px solid var(--line-onDark);}
</style>
</head>
<body>

<section class="page-head">
  <div class="container">
     <a href="javascript:history.back()" class="back-btn">← Regresar</a>
    <div class="eyebrow">Programa del evento</div>
    <h1>Agenda</h1>
    <p>Horario y actividades de Tech Fest 2026 en Campus Hidalgo.</p>
  </div>
</section>

<section class="body-sec">
  <div class="container">
    <div class="itinerary-frame">
      <img src="PON_AQUI_TU_IMAGEN.jpg" alt="Agenda Tech Fest 2026">
    </div>
    <p class="itinerary-note">Haz clic en la imagen para verla en tamaño completo.</p>
  </div>
</section>

<footer>TECH FEST 2026 — Tecnológico de Monterrey · Escuela de Ingeniería y Ciencias · PrepaTec</footer>

<script>
  // Al hacer clic en la imagen, se abre en una pestaña nueva a tamaño completo.
  const img = document.querySelector('.itinerary-frame img');
  img.style.cursor = 'zoom-in';
  img.addEventListener('click', () => window.open(img.src, '_blank'));
</script>
</body>
</html>
