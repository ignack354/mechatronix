<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH FEST 2026 — Convocatoria y Reglamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#12092F;
    --navy-800:#170B4D;
    --violet:#7C3AED;
    --violet-2:#9F5BFF;
    --white:#FFFFFF;
    --paper:#FFFFFF;
    --paper-alt:#F5F3FC;
    --ink:#170B4D;
    --muted:#645C86;
    --muted-onDark:#C9C3E8;
    --line:#E3DEF5;
    --line-onDark:rgba(255,255,255,.16);
    --font-impact:'Anton',sans-serif;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.01em;}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet-2);display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .eyebrow::before{content:"";width:20px;height:2px;background:var(--violet-2);display:inline-block;}

  .page-head{position:relative;overflow:hidden;padding:70px 0 50px;border-bottom:1px solid var(--line);background:var(--navy-800);color:#fff;}
  .page-head::before{content:"";position:absolute;top:0;left:0;width:260px;height:16px;background:repeating-linear-gradient(115deg, var(--violet) 0 16px, transparent 16px 24px);clip-path:polygon(0 0,100% 0,80% 100%,0 100%);}
  .page-head h1{font-family:var(--font-impact);font-weight:400;font-size:clamp(32px,4.8vw,52px);margin-bottom:14px;}
  .page-head p{color:var(--muted-onDark);max-width:560px;font-size:15px;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:15px;letter-spacing:.03em;color:var(--muted-onDark);margin-bottom:22px;}
  .back-btn:hover{color:#fff;}

  section.body-sec{padding:70px 0;}
  section.body-sec + section.body-sec{border-top:1px solid var(--line);}
  h2.section-title{font-size:26px;color:var(--ink);margin-bottom:10px;}
  p.section-sub{color:var(--muted);font-size:14.5px;max-width:560px;margin-bottom:36px;}

  .docs-sec{background:var(--paper-alt);}
  .doc-subhead{font-size:13px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--violet);margin:36px 0 16px;scroll-margin-top:24px;}
  .doc-subhead:first-of-type{margin-top:0;}

  .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .doc-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--violet);
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .doc-card .doc-tag{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--violet);background:#F0E9FE;display:inline-block;padding:4px 9px;width:fit-content;
  }
  .doc-card h3{font-size:16px;color:var(--ink);line-height:1.3;}
  .doc-card p{font-size:13px;color:var(--muted);flex-grow:1;}
  .doc-btn{
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.04em;
    background:var(--violet);color:#fff;padding:11px 16px;
    text-align:center;font-weight:700;transition:background .2s;
  }
  .doc-btn:hover{background:var(--violet-2);}

  /* Chips de filtro para reglamentos */
  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .chip{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;
    padding:8px 14px;border:1px solid var(--line);background:var(--paper);color:var(--muted);
    cursor:pointer;transition:all .15s;
  }
  .chip:hover{border-color:var(--violet);color:var(--violet);}
  .chip.active{background:var(--violet);border-color:var(--violet);color:#fff;}

  .empty-msg{font-size:13.5px;color:var(--muted);font-style:italic;padding:10px 0;grid-column:1/-1;}

  /* ---------- Resto del contenido ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:10px;}
  .cat-card{background:var(--paper);padding:28px 24px;border-top:3px solid var(--violet);}
  .cat-num{font-family:var(--font-mono);font-size:12px;color:var(--violet);display:block;margin-bottom:14px;}
  .cat-card h3{font-size:19px;margin-bottom:8px;color:var(--ink);}
  .cat-card p{font-size:14px;color:var(--muted);}

  .subcats{margin-top:36px;}
  .subcats h4{font-size:15px;color:var(--ink);margin-bottom:14px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;}
  .subcat-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .subcat-list div{border:1px dashed var(--line);padding:14px 16px;font-size:13.5px;color:var(--muted);}
  .subcat-list strong{color:var(--ink);display:block;margin-bottom:3px;font-size:14px;}

  .timeline{position:relative;padding-left:28px;border-left:2px solid var(--line);}
  .timeline-item{position:relative;padding-bottom:34px;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-item::before{content:"";position:absolute;left:-35px;top:4px;width:10px;height:10px;background:var(--paper);border:2px solid var(--violet);border-radius:50%;}
  .timeline-date{font-family:var(--font-mono);font-size:12px;color:var(--violet);margin-bottom:6px;}
  .timeline-item h4{font-size:17px;font-weight:500;margin-bottom:4px;color:var(--ink);}
  .timeline-item p{font-size:14px;color:var(--muted);}

  .rules-list{list-style:none;}
  .rules-list li{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--muted);}
  .rules-list li:last-child{border-bottom:none;}
  .rules-list span{font-family:var(--font-mono);color:var(--violet);flex-shrink:0;font-size:13px;padding-top:1px;min-width:22px;}
  .rules-list strong{color:var(--ink);font-weight:600;}

  .req-box{background:var(--paper-alt);border-left:4px solid var(--violet);padding:26px 28px;margin-bottom:44px;}
  .req-box h3{font-size:17px;color:var(--ink);margin-bottom:10px;}
  .req-box p{font-size:14px;color:var(--muted);}
  .actions{display:flex;gap:14px;flex-wrap:wrap;}
    .btn{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;padding:15px 28px;border:1px solid var(--violet);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s;}
  .btn-primary{background:var(--violet);color:#fff;font-weight:700;}
  footer{padding:26px 0;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--muted-onDark);background:var(--navy-900);border-top:1px solid var(--line-onDark);}
</style>
</head>
<body>

<section class="page-head">
  <div class="container">
    <a href="javascript:history.back()" class="back-btn">← Regresar</a>
    <div class="eyebrow">Bases oficiales</div>
    <h1>Reglamentos</h1>
    
  </div>
</section>


<section class="body-sec docs-sec">
  <div class="container">

    <div class="doc-subhead" id="sec-convocatorias" style="display: none;">Convocatorias</div>
    <div class="doc-grid" id="grid-convocatorias" style="display: none;"></div>

    <div class="doc-subhead" id="sec-reglamentos">Reglamentos</div>
    <div class="filter-row" id="filterRow"></div>
    <div class="doc-grid" id="grid-reglamentos"></div>
     <div class="actions">
      
      <a href="https://forms.gle/zvgj9ykaFapc5WmbA" target="_blank" rel="noopener" class="btn btn-primary">Registrarse →</a>
    </div>
  </div>
</section>


<footer>TECH FEST 2026 — Tecnológico de Monterrey · Escuela de Ingeniería y Ciencias · PrepaTec</footer>

<script>

  const documentos = [


     // ---------------- REGLAMENTOS ----------------
      { tipo:"reglamento", categoria:"Simulador",
      titulo:"Reglamento Simulador DRL",
      desc:"Especificaciones técnicas y criterios de la categoría.",
      url:"reglamentos/Reglamento_01_Simulador_DRL.docx" },

      { tipo:"reglamento", categoria:"Slalom",
      titulo:"Reglamento Slalom Interiores",
      desc:"Especificaciones técnicas y criterios de la categoría.",
      url:"reglamentos/Reglamento_02_Slalom_FPV_Interiores.docx" },

      { tipo:"reglamento", categoria:"Slalom",
      titulo:"Reglamento Slalom Exteriores",
      desc:"Especificaciones técnicas y criterios de la categoría.",
      url:"reglamentos/Reglamento_03_Slalom_FPV_Exteriores.docx" },

      { tipo:"reglamento", categoria:"Drones",
      titulo:"Reglamento Drones Autonomos Seguidor de Linea",
      desc:"Especificaciones técnicas y criterios de la categoría.",
      url:"reglamentos/Reglamento_04_Drones_Autonomos_Seguidor_de_Linea.docx" },
      { tipo:"reglamento", categoria:"Drones",
      titulo:"Reglamento de Drones Autonomos AprilTags",
      desc:"Lineamientos de seguridad y código de conducta para todo el festival.",
      url:"reglamentos/Reglamento_05_Drones_Autonomos_AprilTags.docx" },
    { tipo:"reglamento", categoria:"Formula Tec",
      titulo:"Reglamento Formula Tec",
      desc:"Especificaciones técnicas y criterios de la categoría.",
      url:"reglamentos/Reglamento_06_Formula_TEC.docx" },
      { tipo:"reglamento", categoria:"Handcraft",
      titulo:"Reglamento Handcraft",
      desc:"Lineamientos para las actividades de Handcraft ",
      url:"reglamentos/Reglamento_07_Handcraft_FPV.docx" },

    { tipo:"reglamento", categoria:"Sumo",
      titulo:"Reglamento Sumo 3kg",
      desc:"Reglas y criterios de la categoría de sumo robótico.",
      url:"reglamentos/Reglamento_08_Sumo_3kg_RC.docx" },

    

    { tipo:"reglamento", categoria:"Sumo",
      titulo:"Reglamento Sumo Autonomo 3kg",
      desc:"Reglas comunes a la categoría de sumo autonomo.",
      url:"reglamentos/Reglamento_09_Sumo_Autonomo_3kg.docx" },



    { tipo:"reglamento", categoria:"Seguidor de Línea",
      titulo:"Reglamento de Seguidor de Línea",
      desc:"Criterios de puntaje, empates y entrega de premios.",
      url:"reglamentos/Reglamento_10_Seguidor_de_Linea_Autonomo.docx" }
  ];

  // ---------- Render ----------
  function docCard(doc){
    return `
      <div class="doc-card" data-categoria="${doc.categoria}">
        <span class="doc-tag">${doc.categoria}</span>
        <h3>${doc.titulo}</h3>
        <p>${doc.desc}</p>
        <a href="${doc.url}" target="_blank" rel="noopener" class="doc-btn">Descargar PDF ↓</a>
      </div>`;
  }

  const convocatorias = documentos.filter(d => d.tipo === "convocatoria");
  const reglamentos   = documentos.filter(d => d.tipo === "reglamento");

  const gridConv = document.getElementById('grid-convocatorias');
  const gridRegl = document.getElementById('grid-reglamentos');

  gridConv.innerHTML = convocatorias.length
    ? convocatorias.map(docCard).join('')
    : '<p class="empty-msg">Aún no hay convocatorias publicadas.</p>';

  // ---------- Filtro de reglamentos por categoría ----------
  const categorias = ["Todos", ...new Set(reglamentos.map(d => d.categoria))];
  const filterRow = document.getElementById('filterRow');

  // Lee ?cat=NombreDeCategoria de la URL (viene de los botones "Ver reglamentos"
  // de cada página de evento) para abrir esta página ya filtrada.
  const params = new URLSearchParams(location.search);
  const catParam = params.get('cat');
  const initialCat = (catParam && categorias.includes(catParam)) ? catParam : "Todos";

  filterRow.innerHTML = categorias.map(cat =>
    `<button class="chip${cat===initialCat?' active':''}" data-cat="${cat}">${cat}</button>`
  ).join('');

  function renderReglamentos(filtro){
    const lista = filtro === "Todos" ? reglamentos : reglamentos.filter(d => d.categoria === filtro);
    gridRegl.innerHTML = lista.length
      ? lista.map(docCard).join('')
      : '<p class="empty-msg">No hay reglamentos en esta categoría todavía.</p>';
  }
  renderReglamentos(initialCat);

  filterRow.addEventListener('click', e => {
    if(!e.target.classList.contains('chip')) return;
    filterRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    renderReglamentos(e.target.dataset.cat);
  });
</script>
</body>
</html>
